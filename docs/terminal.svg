<svg xmlns="http://www.w3.org/2000/svg" width="980" height="344" viewBox="0 0 980 344"><rect x="0.5" y="0.5" width="979" height="343" rx="14" fill="#1e2029" stroke="#e2e0d8"/><path d="M0.5,14.5 a14,14 0 0 1 14,-14 h951 a14,14 0 0 1 14,14 v24 h-979 Z" fill="#2c2f3a"/><circle cx="24" cy="20" r="6.5" fill="#ff5f57"/><circle cx="44" cy="20" r="6.5" fill="#febc2e"/><circle cx="64" cy="20" r="6.5" fill="#28c840"/><text x="490.0" y="25" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#b8bcc8" text-anchor="middle"><tspan x="490.0" dy="0.0">Terminal</tspan></text><text x="30" y="82" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="13.5" fill="#8fd1d5"># Step 1: install Homebrew (once). Paste, press Return, type your Mac password when asked.</text><text x="30" y="112" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="13.5" fill="#ffffff"><tspan fill="#f2c14e">$ </tspan>/bin/bash -c &quot;$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)&quot;</text><text x="30" y="150" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="13.5" fill="#8fd1d5"># Step 2: the tools the skills use</text><text x="30" y="180" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="13.5" fill="#ffffff"><tspan fill="#f2c14e">$ </tspan>brew install pandoc poppler</text><text x="30" y="218" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="13.5" fill="#8fd1d5"># Step 3: the apps (skip any you already have)</text><text x="30" y="248" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="13.5" fill="#ffffff"><tspan fill="#f2c14e">$ </tspan>brew install --cask claude google-chrome</text><text x="30" y="286" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="13.5" fill="#8fd1d5"># Optional: opens older Word files (.doc, .rtf)</text><text x="30" y="316" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="13.5" fill="#ffffff"><tspan fill="#f2c14e">$ </tspan>brew install --cask libreoffice</text></svg>