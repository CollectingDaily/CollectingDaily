<svg xmlns="http://www.w3.org/2000/svg" width="980" height="300" viewBox="0 0 980 300"><rect x="0.5" y="0.5" width="979" height="299" rx="14" fill="#ffffff" stroke="#e2e0d8"/><text x="490.0" y="40" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#323748" text-anchor="middle"><tspan x="490.0" dy="0.0">Installing a skill takes five steps</tspan></text><rect x="5.0" y="62" width="170" height="196" rx="12" fill="#f7f4e2" stroke="#d7d2bb"/><circle cx="33.0" cy="92" r="15" fill="#f2c14e"/><text x="33.0" y="97.5" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#323748" text-anchor="middle"><tspan x="33.0" dy="0.0">1</tspan></text><text x="19.0" y="140" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16.5" font-weight="700" fill="#231f20" text-anchor="start"><tspan x="19.0" dy="0.0">Open Claude</tspan></text><text x="19.0" y="166" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.2" font-weight="400" fill="#231f20" text-anchor="start"><tspan x="19.0" dy="0.0">Open the Claude app</tspan><tspan x="19.0" dy="17.8">and click the Code</tspan><tspan x="19.0" dy="17.8">tab.</tspan></text><line x1="178.0" y1="160.0" x2="193.0" y2="160.0" stroke="#8fd1d5" stroke-width="4" stroke-linecap="round"/><path d="M190.0,152.0 L202.0,160.0 L190.0,168.0 Z" fill="#8fd1d5"/><rect x="205.0" y="62" width="170" height="196" rx="12" fill="#f7f4e2" stroke="#d7d2bb"/><circle cx="233.0" cy="92" r="15" fill="#f2c14e"/><text x="233.0" y="97.5" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#323748" text-anchor="middle"><tspan x="233.0" dy="0.0">2</tspan></text><text x="219.0" y="140" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16.5" font-weight="700" fill="#231f20" text-anchor="start"><tspan x="219.0" dy="0.0">Pick a folder</tspan></text><text x="219.0" y="166" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.2" font-weight="400" fill="#231f20" text-anchor="start"><tspan x="219.0" dy="0.0">Choose Local, then</tspan><tspan x="219.0" dy="17.8">any folder, like</tspan><tspan x="219.0" dy="17.8">Documents.</tspan></text><line x1="378.0" y1="160.0" x2="393.0" y2="160.0" stroke="#8fd1d5" stroke-width="4" stroke-linecap="round"/><path d="M390.0,152.0 L402.0,160.0 L390.0,168.0 Z" fill="#8fd1d5"/><rect x="405.0" y="62" width="170" height="196" rx="12" fill="#f7f4e2" stroke="#d7d2bb"/><circle cx="433.0" cy="92" r="15" fill="#f2c14e"/><text x="433.0" y="97.5" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#323748" text-anchor="middle"><tspan x="433.0" dy="0.0">3</tspan></text><text x="419.0" y="140" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16.5" font-weight="700" fill="#231f20" text-anchor="start"><tspan x="419.0" dy="0.0">Paste one line</tspan></text><text x="419.0" y="166" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.2" font-weight="400" fill="#231f20" text-anchor="start"><tspan x="419.0" dy="0.0">Paste the install</tspan><tspan x="419.0" dy="17.8">sentence for the</tspan><tspan x="419.0" dy="17.8">skill and press</tspan><tspan x="419.0" dy="17.8">Return.</tspan></text><line x1="578.0" y1="160.0" x2="593.0" y2="160.0" stroke="#8fd1d5" stroke-width="4" stroke-linecap="round"/><path d="M590.0,152.0 L602.0,160.0 L590.0,168.0 Z" fill="#8fd1d5"/><rect x="605.0" y="62" width="170" height="196" rx="12" fill="#f7f4e2" stroke="#d7d2bb"/><circle cx="633.0" cy="92" r="15" fill="#f2c14e"/><text x="633.0" y="97.5" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#323748" text-anchor="middle"><tspan x="633.0" dy="0.0">4</tspan></text><text x="619.0" y="140" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16.5" font-weight="700" fill="#231f20" text-anchor="start"><tspan x="619.0" dy="0.0">Click Allow</tspan></text><text x="619.0" y="166" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.2" font-weight="400" fill="#231f20" text-anchor="start"><tspan x="619.0" dy="0.0">Claude asks before</tspan><tspan x="619.0" dy="17.8">it downloads the</tspan><tspan x="619.0" dy="17.8">skill. Click Allow.</tspan></text><line x1="778.0" y1="160.0" x2="793.0" y2="160.0" stroke="#8fd1d5" stroke-width="4" stroke-linecap="round"/><path d="M790.0,152.0 L802.0,160.0 L790.0,168.0 Z" fill="#8fd1d5"/><rect x="805.0" y="62" width="170" height="196" rx="12" fill="#323748"/><circle cx="833.0" cy="92" r="15" fill="#8fd1d5"/><text x="833.0" y="97.5" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#323748" text-anchor="middle"><tspan x="833.0" dy="0.0">5</tspan></text><text x="819.0" y="140" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16.5" font-weight="700" fill="#ffffff" text-anchor="start"><tspan x="819.0" dy="0.0">Restart, then /</tspan></text><text x="819.0" y="166" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.2" font-weight="400" fill="#ffffff" text-anchor="start"><tspan x="819.0" dy="0.0">Quit the app (⌘Q),</tspan><tspan x="819.0" dy="17.8">open it again and</tspan><tspan x="819.0" dy="17.8">type / to see the</tspan><tspan x="819.0" dy="17.8">skill.</tspan></text><text x="490.0" y="282" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#6f7280" text-anchor="middle"><tspan x="490.0" dy="0.0">Once per skill. Updating later is one more sentence.</tspan></text></svg>